<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    <title>{% block title %}Portfolio{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <a class="header_logo"><img src="" alt=""></a>
        <div class="header_icon_bar">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="header_menu">
            <li class="header_menu_item"><a href="">Home</a></li>
            <li class="header_menu_item"><a href="">About</a></li>
            <li class="header_menu_item"><a href="">Contact us</a></li>
            <li class="header_menu_item"><a href="">Newsletter</a></li>
        </ul>
    </header>
    <div class="cover">
        {% block cover %}{% endblock %}
    </div>
    <div class="banner">
        {% block banner %}{% endblock %}
    </div>
    <footer class="footer">
        {% block footer %}{% endblock %}
    </footer>

</body>

</html>
